name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

      # The package promises a specific exit code; prove it rather than assume
      # it. A palette with a failing pairing must exit 1 under --wcag and 0
      # without it, or the gate is decorative.
      - name: Exit codes
        run: |
          set -e
          node dist/colorsmine.mjs check --colors "#FFFFFF #F3F4F6 #6B7280 #2563EB #111827" --min B
          ! node dist/colorsmine.mjs check --colors "#808080 #828282 #7e7e7e" --min B
          ! node dist/colorsmine.mjs check --colors "#FFFFFF #9AA7B4 #2563EB #020817" --wcag
          node dist/colorsmine.mjs check --colors "#FFFFFF #9AA7B4 #2563EB #020817" --min B

      # A tarball that builds is not a tarball that installs. Pack it, install
      # it into an empty project, and run the published binary.
      - name: Install from tarball
        run: |
          set -e
          npm pack
          mkdir -p /tmp/consumer/src && cd /tmp/consumer
          printf ':root{--background:#fff;--muted-foreground:#6b7280;--primary:#2563eb;--foreground:#111827}' > src/globals.css
          npm init -y > /dev/null
          npm i "$GITHUB_WORKSPACE"/colorsmine-*.tgz
          npx colorsmine check --min B --wcag

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p fixtures/src
          printf ':root{--background:#fff;--card:#f3f4f6;--muted-foreground:#6b7280;--primary:#2563eb;--foreground:#111827}' > fixtures/src/globals.css
          printf '{"color":{"surface":{"$type":"color","$value":"#ffffff"},"muted":{"$type":"color","$value":"#9aa7b4"},"primary":{"$type":"color","$value":"#2563eb"},"text":{"$type":"color","$value":"#0f172a"}}}' > fixtures/tokens.json

      # --- every input, exercised ---
      - uses: ./
        id: colors
        with:
          colors: '#FFFFFF #F3F4F6 #6B7280 #2563EB #111827'
          min: B
          wcag: 'true'

      - uses: ./
        id: onefile
        with:
          files: fixtures/src/globals.css
          min: B

      - uses: ./
        id: multifile
        with:
          files: fixtures/src/globals.css fixtures/tokens.json
          min: D

      - uses: ./
        id: pinned
        with:
          colors: '#FFFFFF #F3F4F6 #6B7280 #2563EB #111827'
          version: '0.1.3'

      - uses: ./
        id: darkgate
        with:
          colors: '#FFFFFF #F3F4F6 #6B7280 #2563EB #111827'
          min: S
          dark: 'true'
        continue-on-error: true

      - uses: ./
        id: shouldfail
        with:
          colors: '#808080 #828282 #7e7e7e #818181'
          min: B
        continue-on-error: true

      # GitHub drops the outputs of a failed action, so reporting a grade you
      # did not pass is only possible with the gate turned off.
      - uses: ./
        id: reportonly
        with:
          colors: '#808080 #828282 #7e7e7e #818181'
          min: B
          fail-on-error: 'false'

      - name: Assert every input behaved
        run: |
          set -e
          fail() { echo "::error::$1"; exit 1; }

          # outputs are populated and self-consistent
          [ "${{ steps.colors.outputs.passed }}" = "true" ] || fail "colors: expected pass"
          [ "${{ steps.colors.outputs.grade }}" = "S" ]     || fail "colors: expected S, got ${{ steps.colors.outputs.grade }}"
          [ "${{ steps.colors.outputs.score }}" = "94" ]    || fail "colors: expected 94"
          [ -n "${{ steps.colors.outputs.dark-grade }}" ]   || fail "colors: dark-grade empty"
          [ -n "${{ steps.colors.outputs.dark-score }}" ]   || fail "colors: dark-score empty"
          case "${{ steps.colors.outputs.badge }}" in
            https://colorsmine.com/badge/*.svg) ;;
            *) fail "colors: badge url malformed" ;;
          esac

          # reading a file gives the same grade as passing its colors directly
          [ "${{ steps.onefile.outputs.grade }}" = "S" ] || fail "single file: expected S"

          # two files merge into one palette rather than grading only the first
          [ "${{ steps.multifile.outputs.passed }}" = "true" ] || fail "multi file: expected pass at --min D"

          # a pinned version is honoured
          [ "${{ steps.pinned.outputs.grade }}" = "S" ] || fail "pinned 0.1.3: expected S"

          # dark:true tightens the gate — light is S, dark is not
          [ "${{ steps.darkgate.outcome }}" = "failure" ] || fail "dark gate should have failed at --min S"

          # a broken palette fails the step — and still reports, because the
          # script now survives its own non-zero check
          [ "${{ steps.shouldfail.outcome }}" = "failure" ] || fail "broken palette should fail"
          [ "${{ steps.shouldfail.outputs.grade }}" = "D" ] || fail "failed step should still publish outputs, got '${{ steps.shouldfail.outputs.grade }}'"
          [ "${{ steps.darkgate.outputs.grade }}" = "S" ] || fail "dark gate: light grade should still be S, got '${{ steps.darkgate.outputs.grade }}'"

          # ...and with the gate off it succeeds and still reports the grade,
          # which is the only shape in which a failing palette can be commented
          # on a PR — GitHub publishes no outputs for a failed action.
          [ "${{ steps.reportonly.outcome }}" = "success" ] || fail "fail-on-error:false should not fail the step"
          [ "${{ steps.reportonly.outputs.passed }}" = "false" ] || fail "report-only: passed should be false"
          [ "${{ steps.reportonly.outputs.grade }}" = "D" ] || fail "report-only: expected D, got ${{ steps.reportonly.outputs.grade }}"

          echo "all action inputs and outputs verified"

      - name: Job summary was written
        run: |
          set -e
          test -s "$GITHUB_STEP_SUMMARY" || { echo "::error::step summary is empty"; exit 1; }
          grep -q "Palette" "$GITHUB_STEP_SUMMARY" || { echo "::error::summary missing grade heading"; exit 1; }
          grep -q "Pairing" "$GITHUB_STEP_SUMMARY" || { echo "::error::summary missing pairing table"; exit 1; }
          echo "summary contains $(wc -l < "$GITHUB_STEP_SUMMARY") lines"
